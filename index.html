<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEREA TRAVEL</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #07111f, #123b52);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
}

.container {
    width: 100%;
    max-width: 430px;
    text-align: center;
    background: rgba(255,255,255,0.08);
    padding: 35px 25px;
    border-radius: 25px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.35);
}

.logo {
    font-size: 38px;
    font-weight: bold;
    letter-spacing: 3px;
    color: white;
    margin-bottom: 8px;
}

.tagline {
    color: #d8e8ef;
    font-size: 15px;
    margin-bottom: 30px;
}

.button {
    display: block;
    text-decoration: none;
    padding: 17px;
    margin: 15px 0;
    border-radius: 14px;
    color: white;
    font-size: 18px;
    font-weight: bold;
    transition: 0.2s;
}

.button:hover {
    transform: scale(1.03);
}

.facebook {
    background: #1877f2;
}

.instagram {
    background: linear-gradient(45deg, #feda75, #d62976, #962fbf, #4f5bd5);
}

.whatsapp {
    background: #25d366;
}

.footer {
    margin-top: 25px;
    color: #b8cbd4;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">NEREA TRAVEL</div>

    <div class="tagline">
        Explore • Experience • Enjoy
    </div>

    <a class="button facebook"
       href="https://www.facebook.com/share/1Gb8npipHH/"
       target="_blank">
       Facebook
    </a>

    <a class="button instagram"
       href="https://www.instagram.com/nerea_travel1?igsi=Z2d4ejhmMmgwZnM4"
       target="_blank">
       Instagram
    </a>

    <a class="button whatsapp"
       href="https://wa.me/201036829190"
       target="_blank">
       WhatsApp
    </a>

    <div class="footer">
        Travel • Discover • Experience • Memories
    </div>

</div>

</body>
</html>
